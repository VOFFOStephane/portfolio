<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stéphane Ndienyim — Étudiant en développement web</title>
    <meta
      name="description"
      content="Portfolio de Stéphane Ndienyim, étudiant en développement web à la recherche d'un stage."
    />
    <link rel="icon" type="image/svg+xml" href="./public/favicon.svg" />
    <link rel="stylesheet" href="/dist/bundle.css" />
    <!--
      Applique le thème (clair/sombre) AVANT que React ne démarre.
      Sans ça, la page s'afficherait brièvement dans le mauvais thème
      le temps que React se charge (un "flash" désagréable).
    -->
    <script>
      (function () {
        var saved = null;
        try {
          saved = localStorage.getItem("theme");
        } catch (e) {}
        var theme =
          saved || (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/dist/bundle.js"></script>
  </body>
</html>
